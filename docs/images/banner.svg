<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">go2lean — Go in. Evidence out.</title>
  <desc id="desc">Model Go functions in Lean, search for counterexamples, then replay them with real Go tests. A research prototype for finding bugs.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24353d" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#101e26"/>
  <rect x="640" width="560" height="440" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="48" y="38" width="240" height="30" rx="15" fill="#24373d"/>
    <text x="64" y="59" fill="#a7d4d5" font-size="13" font-weight="600" letter-spacing="1.5">GO + LEAN 4 / BUG FINDER</text>
    <text x="44" y="150" font-size="78" font-weight="750" letter-spacing="-4" fill="#f3f5ed">go<tspan fill="#65ddc2">2</tspan>lean</text>
    <text x="48" y="207" fill="#f3f5ed" font-size="34" font-weight="600" letter-spacing="-1">Go in. Evidence out.</text>
    <text x="48" y="249" fill="#b5c6cb" font-size="20">Model the code. Find a counterexample.</text>
    <text x="48" y="278" fill="#b5c6cb" font-size="20">Let real Go tests decide.</text>
    <g font-size="14" font-weight="600">
      <rect x="48" y="320" width="151" height="36" rx="8" fill="#203c3b"/><text x="66" y="343" fill="#85e4ce">Executable models</text>
      <rect x="209" y="320" width="124" height="36" rx="8" fill="#203c3b"/><text x="228" y="343" fill="#85e4ce">Specs in Go</text>
      <rect x="343" y="320" width="152" height="36" rx="8" fill="#203c3b"/><text x="361" y="343" fill="#85e4ce">Replayable tests</text>
    </g>
    <text x="48" y="401" fill="#93aab2" font-size="13" letter-spacing="1.4">RESEARCH PROTOTYPE · BOUNDED SEARCH</text>
    <rect x="624" y="62" width="528" height="310" rx="16" fill="#152730" stroke="#38505a"/>
    <path d="M624 108H1152" stroke="#38505a"/>
    <circle cx="648" cy="85" r="5" fill="#ecac82"/><circle cx="667" cy="85" r="5" fill="#d7c17d"/><circle cx="686" cy="85" r="5" fill="#65ddc2"/>
    <text x="1130" y="90" text-anchor="end" font-size="12" fill="#94aeb6" letter-spacing="1.5">THE EVIDENCE PIPELINE</text>
    <g font-family="'SFMono-Regular', Consolas, monospace" font-size="18">
      <text x="651" y="151" fill="#65ddc2">01 <tspan fill="#eaf1ee">Go source → Lean model</tspan></text>
      <text x="651" y="199" fill="#65ddc2">02 <tspan fill="#eaf1ee">Search → candidate input</tspan></text>
      <text x="651" y="247" fill="#65ddc2">03 <tspan fill="#eaf1ee">go test → replay verdict</tspan></text>
    </g>
    <rect x="648" y="283" width="480" height="63" rx="8" fill="#233e3b"/>
    <path d="m668 314 7 7 14-16" stroke="#85e4ce" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="706" y="309" fill="#a0ecd8" font-size="16" font-weight="600">Real execution is the judge.</text>
    <text x="706" y="331" fill="#b5c6cb" font-size="14">A model counterexample is not yet a bug.</text>
  </g>
</svg>
