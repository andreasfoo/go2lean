name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail

# Two jobs in parallel, about 10 minutes; a change to documentation only
# (docs/, .claude/, *.md) runs neither, and skipped jobs count as passed.
# The Lean proofs and the proof judge's checks run on demand only
# (proofs.yml). Each job sets up through .github/actions/setup.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! files=$(git diff --name-only "$BASE" HEAD); then
            echo code=true
          elif grep -qvE '^(docs/|\.claude/)|\.md$' <<< "$files"; then
            echo code=true
          else
            echo code=false
          fi | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./cmd/go2lean

      - name: Sandbox integration (missing isolation must fail, not skip)
        env:
          GO2LEAN_REQUIRE_SANDBOX_TESTS: "1"
        run: go test ./internal/sandbox ./internal/poc -count=1 -v

      - name: Builtin snapshot model search and independent Go replay
        env:
          GO2LEAN_REQUIRE_SANDBOX_TESTS: "1"
          GO2LEAN_REQUIRE_BUILTIN_TESTS: "1"
        run: go test ./internal/pipeline -run TestBuiltinSearchReplayFromPersistedSnapshot -count=1 -v

      - name: Installed binary with checkout hidden (packaging only)
        run: |
          git clone https://github.com/google/uuid.git "$RUNNER_TEMP/install-uuid"
          git -C "$RUNNER_TEMP/install-uuid" checkout --detach 2d3c2a9cc518326daf99a383f07c4d3c44317e4d
          scripts/install-smoke.sh "$RUNNER_TEMP/install-uuid" "$RUNNER_TEMP/install-smoke"

      - name: Installed binary with missing then provisioned external dependencies
        run: |
          git clone https://github.com/go-logr/stdr.git "$RUNNER_TEMP/install-stdr"
          git -C "$RUNNER_TEMP/install-stdr" checkout --detach 521af2addfa7c81c8a65d0e85ed34bb6bb6dc262
          scripts/install-smoke.sh "$RUNNER_TEMP/install-stdr" "$RUNNER_TEMP/install-stdr-smoke" --require-external-deps

      - name: Installed packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-packaging
          path: |
            ${{ runner.temp }}/install-smoke/*.log
            ${{ runner.temp }}/install-stdr-smoke/*.log
          if-no-files-found: ignore

      - name: Differential gate unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Ground-truth regression without Lean proofs (testdata/regress/examples.golden)
        env:
          PROVE: "0"
        run: scripts/regress.sh "$RUNNER_TEMP/regress"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ${{ runner.temp }}/regress/run.log
            ${{ runner.temp }}/regress/outcomes.txt
          if-no-files-found: ignore

  # The library models against Go (scripts/json-diff.sh).
  models:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: encoding/json model against Go
        run: scripts/json-diff.sh "$RUNNER_TEMP/json-diff" 4 | tail -5

      - name: regexp model against Go
        run: PKG=testdata/rediff scripts/json-diff.sh "$RUNNER_TEMP/re-diff" 6 | tail -5

      - name: strconv model against Go
        run: PKG=testdata/convdiff scripts/json-diff.sh "$RUNNER_TEMP/conv-diff" 6 | tail -5

      - name: json.Valid model against Go
        run: PKG=testdata/jsonvalid scripts/json-diff.sh "$RUNNER_TEMP/valid-diff" 6 | tail -5

      - name: JSON number round trips against Go
        run: PKG=testdata/numdiff scripts/json-diff.sh "$RUNNER_TEMP/num-diff" 6 | tail -5

      - name: net/url (translated from source) against Go
        run: DEPS=1 PKG=testdata/urldiff scripts/json-diff.sh "$RUNNER_TEMP/url-diff" 6 | tail -5

      - name: reflect Kind/IsNil and utf16.Encode against Go
        run: PKG=testdata/miscdiff scripts/json-diff.sh "$RUNNER_TEMP/misc-diff" 6 | tail -5

      - name: strings, strconv and utf8 models against Go
        run: DEPS=1 PKG=testdata/stdaudit scripts/json-diff.sh "$RUNNER_TEMP/std-audit" 6 | tail -5

      - name: Native string comparison bridge against Go
        run: DEPS=1 PKG=testdata/stringcmpdiff scripts/json-diff.sh "$RUNNER_TEMP/stringcmp-diff" 6 | tail -5

      - name: Goose's semantics tests, the model against Go
        run: scripts/sem-diff.sh "$RUNNER_TEMP/sem-diff" | tail -5

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: model-logs
          path: |
            ${{ runner.temp }}/json-diff/*.log
            ${{ runner.temp }}/re-diff/*.log
            ${{ runner.temp }}/conv-diff/*.log
            ${{ runner.temp }}/valid-diff/*.log
            ${{ runner.temp }}/num-diff/*.log
            ${{ runner.temp }}/url-diff/*.log
            ${{ runner.temp }}/misc-diff/*.log
            ${{ runner.temp }}/std-audit/*.log
            ${{ runner.temp }}/stringcmp-diff/*.log
            ${{ runner.temp }}/sem-diff/*.log
            ${{ runner.temp }}/sem-diff/outcomes.txt
          if-no-files-found: ignore
