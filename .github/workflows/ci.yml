name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail

# Four jobs in parallel; the wall time is the longest one (the regression,
# about 18 minutes). Each sets up through .github/actions/setup.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./cmd/go2lean

      - name: Differential gate unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Ground-truth regression (testdata/regress/examples.golden)
        run: scripts/regress.sh "$RUNNER_TEMP/regress"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ${{ runner.temp }}/regress/run.log
            ${{ runner.temp }}/regress/outcomes.txt
          if-no-files-found: ignore

  # The library models against Go (scripts/json-diff.sh).
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: encoding/json model against Go
        run: scripts/json-diff.sh "$RUNNER_TEMP/json-diff" 4 | tail -5

      - name: regexp model against Go
        run: PKG=testdata/rediff scripts/json-diff.sh "$RUNNER_TEMP/re-diff" 6 | tail -5

      - name: strconv model against Go
        run: PKG=testdata/convdiff scripts/json-diff.sh "$RUNNER_TEMP/conv-diff" 6 | tail -5

      - name: json.Valid model against Go
        run: PKG=testdata/jsonvalid scripts/json-diff.sh "$RUNNER_TEMP/valid-diff" 6 | tail -5

      - name: JSON number round trips against Go
        run: PKG=testdata/numdiff scripts/json-diff.sh "$RUNNER_TEMP/num-diff" 6 | tail -5

      - name: net/url (translated from source) against Go
        run: DEPS=1 PKG=testdata/urldiff scripts/json-diff.sh "$RUNNER_TEMP/url-diff" 6 | tail -5

      - name: reflect Kind/IsNil and utf16.Encode against Go
        run: PKG=testdata/miscdiff scripts/json-diff.sh "$RUNNER_TEMP/misc-diff" 6 | tail -5

      - name: strings, strconv and utf8 models against Go
        run: DEPS=1 PKG=testdata/stdaudit scripts/json-diff.sh "$RUNNER_TEMP/std-audit" 6 | tail -5

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: model-logs
          path: |
            ${{ runner.temp }}/json-diff/*.log
            ${{ runner.temp }}/re-diff/*.log
            ${{ runner.temp }}/conv-diff/*.log
            ${{ runner.temp }}/valid-diff/*.log
            ${{ runner.temp }}/num-diff/*.log
            ${{ runner.temp }}/url-diff/*.log
            ${{ runner.temp }}/misc-diff/*.log
            ${{ runner.temp }}/std-audit/*.log
          if-no-files-found: ignore

  # Proofs (docs/trust.md): the judge runs Lean's comparator in bubblewrap,
  # and Lean text an agent wrote runs only there.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Proved properties against the real Go code
        run: go test ./examples/proofs ./examples/invariants ./examples/loops ./examples/strloops

      - name: Functional proofs, judged (lean/Proofs/Functional.lean, examples/*/proofs.json)
        run: scripts/proofs.sh "$RUNNER_TEMP/proofs"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proof-logs
          path: ${{ runner.temp }}/proofs/*.log
          if-no-files-found: ignore

  # The proof judge's own checks: attacks it must reject, mutants that
  # must not prove.
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Red-team corpus of the proof judge (testdata/redteam)
        run: scripts/redteam.sh "$RUNNER_TEMP/redteam" 4

      - name: Semantic mutants of the proved functions (testdata/mutants.txt)
        run: scripts/mutants.sh "$RUNNER_TEMP/mutants" 4

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: judge-logs
          path: |
            ${{ runner.temp }}/redteam/*.log
            ${{ runner.temp }}/redteam/verdicts.txt
            ${{ runner.temp }}/mutants/*.log
            ${{ runner.temp }}/mutants/verdicts.txt
          if-no-files-found: ignore
